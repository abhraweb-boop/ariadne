name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ariadne-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync deps (dev + ariadne extras)
        run: uv sync --extra dev --extra ariadne --frozen
      - name: Run Prime Hermes test suite
        run: uv run --no-sync python -m pytest tests/ariadne/ -q
        env:
          # keep the suite hermetic: never live-call LLMs in CI
          GEMINI_API_KEY: ""
          OPENROUTER_API_KEY: ""
