# Dependabot configuration for Prime Hermes (fork of hermes-agent).
#
# Inherited from upstream, which runs ~30 GitHub Actions workflows. This fork
# runs only .github/workflows/tests.yml; scheduled action-bump PRs against
# unused inherited workflows were noise (closed as not-planned in bulk).
#
# Scheduled bumps for the actions ecosystem are therefore PAUSED
# (open-pull-requests-limit: 0). Bump actions manually when touching CI.
#
# We also do NOT enable Dependabot for pip / npm source dependencies:
# pins are exact (uv.lock, package-lock.json) as part of the supply-chain
# posture and move deliberately, after review.
#
# CVE-driven security updates (repo settings → Dependabot security updates)
# remain enabled separately — they fire only when a pinned version becomes
# known-bad, which is exactly when we want to move a pin.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
