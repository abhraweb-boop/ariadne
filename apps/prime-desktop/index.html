<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime Hermes</title>
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      :focus-visible { outline: 2px solid #5e6ad2; outline-offset: 1px; }
      button:focus-visible { outline: 2px solid #5e6ad2; outline-offset: 2px; }
      /* A1: titlebar drag regions (class-based so tests can assert them) */
      .ph-drag { -webkit-app-region: drag; }
      .ph-no-drag { -webkit-app-region: no-drag; }
      /* B2: streaming indicator animation */
      @keyframes ph-stream {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
